<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="/src/style.css">

  <title>Frontend Mentor | Social links profile</title>
  <meta name="description" content="Frontend Mentor | Social links profile">
</head>

<body>

  <div class="container">
    <div class="card">
      <img src="/assets/images/avatar-jessica.jpeg" alt="Profile Picture" class="profile">
      <h1 class="name">Jessica Randall</h1>
      <p class="address">London, United Kingdom</p>
      <p class="job_desc">"Front-end developer and avid reader."</p>
      <div class="socials">
        <a href="#" class="social-platform">Github</a>
        <a href="#" class="social-platform">Fronend Mentor</a>
        <a href="#" class="social-platform">LinkedIn</a>
        <a href="#" class="social-platform">Twitter</a>
        <a href="#" class="social-platform">Instagram</a>
      </div>
    </div>
  </div>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="https://www.facebook.com/profile.php?id=100080671484819" target="_blank">Anto</a>.
  </div>
</body>

</html>
